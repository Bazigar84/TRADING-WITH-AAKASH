<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',sans-serif;
    color:#fff;
    background-color:#141414;
    background-image:
      linear-gradient(30deg,#1b1b1b 12%,transparent 12.5%,transparent 87%,#1b1b1b 87.5%,#1b1b1b),
      linear-gradient(150deg,#1b1b1b 12%,transparent 12.5%,transparent 87%,#1b1b1b 87.5%,#1b1b1b),

      linear-gradient(60deg,#222 25%,transparent 25.5%,transparent 75%,#222 75%,#222);
    background-size:40px 70px;
    background-position:0 0,0 0,20px 35px,20px 35px,0 0,20px 35px;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .wrap{width:100%;max-width:520px}
  .card{
    background:linear-gradient(180deg,#262626,#1e1e1e);
    border:1px solid #3a3a3a;
    border-radius:22px;
    padding:32px 22px 28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
  }
  .avatar{
    width:96px;height:96px;border-radius:50%;
    border:3px solid #ffc400;
    object-fit:cover;background:#e8e8e8;
    display:block;margin:0 auto 18px;
  }
  h1{
    font-size:28px;font-weight:800;letter-spacing:.3px;
    color:#ffc400;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  h1 .crown{font-size:26px}
  .trusted{margin-top:10px;font-size:14px;color:#d8d8d8;display:flex;align-items:center;justify-content:center;gap:6px}
  .tick{
    display:inline-flex;width:16px;height:16px;border-radius:3px;
    background:#2ecc71;color:#fff;font-size:12px;align-items:center;justify-content:center;font-weight:700
  }
  .badges{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{
    background:#333;border:1px solid #444;border-radius:10px;
    padding:10px 16px;font-size:12.5px;font-weight:600;
  }
  .join{
    margin:28px auto 26px;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:linear-gradient(90deg,#0a6cff,#00c6ff);
    color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    padding:14px 34px;border-radius:40px;
    box-shadow:0 8px 22px rgba(0,140,255,.35);
    transition:transform .2s ease,box-shadow .2s ease;
    animation:pulse 2s infinite;
  }
  .join:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 30px rgba(0,170,255,.55)}
  .join svg{width:18px;height:18px;fill:#fff}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(0,170,255,.55)}
    70%{box-shadow:0 0 0 16px rgba(0,170,255,0)}
    100%{box-shadow:0 0 0 0 rgba(0,170,255,0)}
  }
  .list{display:flex;flex-direction:column;gap:12px;text-align:left}
  .item{
    background:#2f2f2f;border:1px solid #444;border-radius:10px;
    padding:12px 12px;font-size:13.5px;font-weight:500;
    display:flex;align-items:center;gap:8px;
  }
  .dot{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;
    background:#1ee27a;color:#0b2b1a;font-size:10px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
  }
  footer{margin-top:18px;text-align:center;font-size:12px;color:#8d8d8d}
